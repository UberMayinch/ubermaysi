name: build & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *" # refresh aggregated feed every 6h
  workflow_dispatch:

permissions:
  contents: write # commit data/archive.json back
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      - run: node build.mjs
        env:
          PUBLIC_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      # Persist the archive so old posts survive feed windows and failed fetches. Also counts as repo
      # activity, so GitHub doesn't auto-disable the schedule after 60 quiet days.
      - name: commit archive
        run: |
          git diff --quiet -- data/archive.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive.json
          git commit -m "refresh feed archive"
          git pull --rebase -X theirs origin main || true
          git push origin HEAD:main
